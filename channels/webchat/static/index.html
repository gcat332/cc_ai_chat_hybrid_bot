<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ศูนย์บริการลูกค้า</title>
<style>
  :root { --brand: #0b6e4f; --bg: #f4f6f5; --bot: #ffffff; --me: #0b6e4f; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Sarabun", "Noto Sans Thai", "Loma", "Tahoma", sans-serif;
         background: var(--bg); display: flex; justify-content: center; }
  .chat { width: 100%; max-width: 440px; height: 100vh; display: flex; flex-direction: column;
          background: var(--bg); box-shadow: 0 0 24px rgba(0,0,0,.08); }
  header { background: var(--brand); color: #fff; padding: 14px 16px; display: flex;
           align-items: center; gap: 10px; }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: #7CFC9A; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header small { opacity: .85; display: block; font-size: 12px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 82%; padding: 9px 13px; border-radius: 16px; line-height: 1.55;
         white-space: pre-wrap; font-size: 15px; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px;
         box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .me { background: var(--me); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .ai-tag { display: block; margin-top: 4px; font-size: 11px; color: #888; }
  .note { align-self: center; font-size: 12px; color: #666; background: #e6ece9;
          padding: 4px 10px; border-radius: 10px; }
  #quick { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 8px; }
  #quick button { border: 1px solid var(--brand); color: var(--brand); background: #fff;
                  border-radius: 16px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  #quick button:hover { background: #e9f4ef; }
  form { display: flex; gap: 8px; padding: 10px 12px; background: #fff; border-top: 1px solid #e3e3e3; }
  input { flex: 1; border: 1px solid #ccc; border-radius: 20px; padding: 10px 14px; font: inherit; font-size: 15px; }
  input:focus { outline: 2px solid var(--brand); border-color: transparent; }
  form button { background: var(--brand); color: #fff; border: 0; border-radius: 20px;
                padding: 0 18px; font: inherit; cursor: pointer; }
  form button:disabled, input:disabled { opacity: .5; }
  .icon { border: 0; background: transparent; font-size: 20px; cursor: pointer; padding: 0 6px; }
  header > div { flex: 1; }
  header .icon { color: #fff; }
  form .icon { border: 1px solid #ccc; border-radius: 50%; width: 42px; height: 42px; padding: 0;
               background: #fff; color: var(--brand); flex: none; }
  /* press-and-hold must not open the phone's long-press menu or select text */
  #mic { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  form .icon.on { background: #d93025; border-color: #d93025; color: #fff;
                  animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(217,48,37,.25); } }

  /* ---- call screen ---- */
  #callScreen { position: fixed; inset: 0; margin: 0 auto; max-width: 440px; z-index: 10;
                display: flex; flex-direction: column; align-items: center; padding: 28px 20px 24px;
                color: #fff; background: linear-gradient(180deg, #0b6e4f 0%, #063f2d 100%); }
  #callScreen[hidden] { display: none; }
  .call-name { font-size: 22px; font-weight: 600; margin-top: 8px; }
  #callTimer { font-variant-numeric: tabular-nums; opacity: .85; margin-top: 2px; }
  .avatar { width: 116px; height: 116px; border-radius: 50%; margin: 26px 0 14px; font-size: 54px;
            display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.15); }
  #callScreen[data-state="listening"] .avatar { animation: ring 1.4s ease-out infinite; }
  #callScreen[data-state="speaking"] .avatar { animation: talk .9s ease-in-out infinite; }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(124,252,154,.6); } 100% { box-shadow: 0 0 0 26px rgba(124,252,154,0); } }
  @keyframes talk { 50% { transform: scale(1.06); background: rgba(255,255,255,.25); } }
  #callStatus { font-size: 15px; min-height: 22px; opacity: .95; text-align: center; }
  .caption { width: 100%; flex: 1; overflow-y: auto; margin: 14px 0 10px; text-align: center; }
  #callCaption { font-size: 17px; line-height: 1.6; white-space: pre-wrap; }
  #callInterim { margin-top: 10px; font-size: 16px; color: #b8f5c9; min-height: 24px; }
  #callError { margin-top: 10px; font-size: 14px; color: #ffd2cc; }
  #callChips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 10px; }
  #callChips button { border: 1px solid rgba(255,255,255,.5); background: transparent; color: #fff;
                      border-radius: 16px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  #keypad { display: grid; grid-template-columns: repeat(3, 64px); gap: 10px; margin-bottom: 14px; }
  #keypad[hidden] { display: none; }
  #digits { grid-column: 1 / -1; text-align: center; font-size: 24px; letter-spacing: 2px;
            min-height: 34px; font-variant-numeric: tabular-nums; }
  #keypad button { height: 54px; border-radius: 27px; border: 0; font: inherit; font-size: 22px;
                   background: rgba(255,255,255,.16); color: #fff; cursor: pointer; }
  #keypad button.ok { background: #7CFC9A; color: #063f2d; font-size: 16px; font-weight: 600; }
  .controls { display: flex; gap: 26px; align-items: flex-start; }
  .controls button { width: 64px; height: 64px; border-radius: 50%; border: 0; font-size: 26px;
                     background: rgba(255,255,255,.16); color: #fff; cursor: pointer; }
  .controls button[aria-pressed="true"] { background: #fff; color: #063f2d; }
  .controls #hangup { background: #d93025; transform: rotate(135deg); }  /* receiver down */
  .controls label { display: block; text-align: center; font-size: 12px; margin-top: 6px; opacity: .9; }
</style>
</head>
<body>
<div class="chat">
  <header><span class="dot"></span><div><h1>ศูนย์บริการลูกค้า</h1><small>ผู้ช่วยอัตโนมัติ · พิมพ์หรือพูดก็ได้</small></div>
    <a href="admin.html" class="icon" title="ดูและแก้ไขข้อมูลลูกค้า" style="text-decoration:none">📋</a>
    <button id="callBtn" class="icon" type="button" title="โทรคุยกับผู้ช่วย" hidden disabled>📞</button>
    <button id="speak" class="icon" type="button" aria-pressed="false" title="เปิดเสียงตอบกลับ">🔈</button></header>
  <div id="log" aria-live="polite"></div>
  <div id="quick"></div>
  <form id="form">
    <button id="mic" class="icon" type="button" aria-pressed="false" title="แตะเพื่อพูด หรือกดค้างไว้แล้วปล่อยเพื่อส่ง">🎤</button>
    <input id="text" autocomplete="off" placeholder="พิมพ์ข้อความ หรือกดไมค์เพื่อพูด" aria-label="ข้อความ">
    <button>ส่ง</button>
  </form>
</div>
<div id="callScreen" hidden data-state="" role="dialog" aria-label="กำลังโทร">
  <div class="call-name">ศูนย์บริการลูกค้า</div>
  <div id="callTimer">00:00</div>
  <div class="avatar" aria-hidden="true">🎧</div>
  <div id="callStatus" aria-live="polite">กำลังเชื่อมต่อ…</div>
  <div class="caption">
    <div id="callCaption"></div>
    <div id="callInterim"></div>
    <div id="callError" role="alert"></div>
  </div>
  <div id="callChips"></div>
  <div id="keypad" hidden>
    <div id="digits" aria-live="polite"></div>
  </div>
  <div class="controls">
    <div><button id="muteBtn" type="button" aria-pressed="false" aria-label="ปิดไมค์">🎙️</button><label>ปิดไมค์</label></div>
    <div><button id="keypadBtn" type="button" aria-pressed="false" aria-label="แป้นตัวเลข">⌨️</button><label>แป้นตัวเลข</label></div>
    <div><button id="hangup" type="button" aria-label="วางสาย">📞</button><label>วางสาย</label></div>
  </div>
</div>
<script src="runtime.js"></script>
<script>
const log = document.getElementById("log"), quick = document.getElementById("quick");
const form = document.getElementById("form"), input = document.getElementById("text");
let sessionId = sessionStorage.getItem("chat_session") || crypto.randomUUID();
sessionStorage.setItem("chat_session", sessionId);

function add(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;           // textContent, never innerHTML: no script injection
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}
function note(text) { add(text, "note"); }

function show(reply) {
  add(reply.text, "bot");
  if (reply.intent === "fallback") {  // written by AI, not by the rules: say so
    const tag = document.createElement("small");
    tag.className = "ai-tag"; tag.textContent = "ตอบโดย AI · อาจคลาดเคลื่อนได้";
    log.lastChild.appendChild(tag);
  }
  speak(reply);
  quick.innerHTML = "";
  for (const label of reply.quick_replies || []) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label;
    b.onclick = () => send(label);
    quick.appendChild(b);
  }
  if (reply.handoff) note("กำลังเชื่อมต่อเจ้าหน้าที่…");
  if (reply.end) {
    note("จบการสนทนา");
    sessionId = crypto.randomUUID();
    sessionStorage.setItem("chat_session", sessionId);
  }
}

// The bot runs on the server or inside this page (GitHub Pages): see runtime.js.
let runtime = null;

async function call(path, body) {
  return path === "api/start" ? runtime.start(sessionId) : runtime.chat(sessionId, body.message);
}

async function send(text, fromVoice = false) {
  voiceTurn = fromVoice;
  text = text.trim();
  if (!text) return;
  add(text, "me");
  input.value = ""; quick.innerHTML = "";
  try { show(await call("api/chat", { message: text })); }
  catch { note("ระบบขัดข้องชั่วคราว กรุณาลองใหม่อีกครั้ง"); }
  input.focus();
}

form.onsubmit = e => { e.preventDefault(); send(input.value); };

// ---- Voice: speak to the bot and hear it answer (Web Speech API, Thai) ---------------------
// Speech recognition: Chrome, Edge, Safari (not Firefox). Needs HTTPS or localhost.
// In Chrome the audio is recognised by Google's servers (tell customers in your privacy notice).
const micBtn = document.getElementById("mic"), speakBtn = document.getElementById("speak");
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const canSpeak = "speechSynthesis" in window;
let recognizer = null, listening = false, speakOn = false, voiceTurn = false;
// Two ways to use the mic:
// * tap: hands-free. Listens until you pause, sends, and listens again after each spoken reply.
// * press and hold: push-to-talk. Listens while held, sends when released, no auto-listen after.
let handsFree = true, holding = false, pressed = false, holdTimer = null, warnedInApp = false;
const HOLD_MS = 350;
// In-app browsers (LINE, Facebook, Instagram) often show the API but cannot use the mic.
const IN_APP = /\bLine\/|FBAN|FBAV|Instagram/i.test(navigator.userAgent);
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
// Why recognition failed, in words the customer can act on. Codes from the Web Speech API.
const MIC_ERRORS = {
  "not-allowed": IS_IOS
    ? "ไม่ได้รับอนุญาตให้ใช้ไมโครโฟน: เปิด การตั้งค่า > Safari > ไมโครโฟน และเปิด Siri และการป้อนตามคำบอก (Dictation)"
    : "ไม่ได้รับอนุญาตให้ใช้ไมโครโฟน: กดรูปแม่กุญแจข้างช่องที่อยู่เว็บ แล้วอนุญาตไมโครโฟน",
  "service-not-allowed": IS_IOS
    ? "ใช้การฟังเสียงไม่ได้: เปิด การตั้งค่า > Siri และเปิดการป้อนตามคำบอก (Dictation) ก่อน"
    : "เบราว์เซอร์นี้ไม่อนุญาตให้ใช้การฟังเสียง ลองเปิดใน Chrome, Edge หรือ Safari",
  "network": "ระบบแปลงเสียงเชื่อมต่อไม่ได้ เบราว์เซอร์นี้อาจไม่รองรับ (เช่น Brave) หรือเน็ตมีปัญหา ลองใช้ Chrome, Edge หรือ Safari",
  "audio-capture": "ไม่พบไมโครโฟน ตรวจว่าเสียบไมค์แล้ว และไม่มีแอปอื่นใช้อยู่",
  "language-not-supported": "เบราว์เซอร์นี้ไม่รองรับการฟังภาษาไทย ลองใช้ Chrome, Edge หรือ Safari",
  "bad-grammar": "เบราว์เซอร์นี้ฟังเสียงไม่สำเร็จ ลองใช้ Chrome, Edge หรือ Safari",
};
// Never let a non-Thai voice read Thai text: the browser's default is usually English, which
// reads Thai as English-sounding noise. voiceState: "thai" (a Thai voice is installed),
// "none" (voices are listed, none Thai: show text only), "unknown" (the browser lists no voices,
// as some Android phones do; the phone's own Thai engine may still speak, so try).
let thaiVoice = null, voiceState = "unknown", warnedNoVoice = false;
const isThai = v => v.lang.replace("_", "-").toLowerCase().startsWith("th");

function pickThaiVoice() {
  const voices = speechSynthesis.getVoices();
  const thai = voices.filter(isThai);
  // Prefer the natural-sounding voices when there are several.
  thaiVoice = thai.find(v => /premwadee|niwat|achara|natural|neural|google/i.test(v.name)) || thai[0] || null;
  voiceState = thaiVoice ? "thai" : voices.length ? "none" : "unknown";
}

function onVoicesChanged(fn, once = false) {   // older browsers only have onvoiceschanged
  if (speechSynthesis.addEventListener) return speechSynthesis.addEventListener("voiceschanged", fn, { once });
  const previous = speechSynthesis.onvoiceschanged;
  speechSynthesis.onvoiceschanged = e => { if (previous) previous(e); fn(e); };
}

function voicesReady() {   // voices load after the page: wait for them (at most 1.5 s)
  return new Promise(resolve => {
    if (!canSpeak || speechSynthesis.getVoices().length) return resolve();
    const timer = setTimeout(resolve, 1500);
    onVoicesChanged(() => { clearTimeout(timer); resolve(); }, true);
  });
}

const canSayThai = () => canSpeak && voiceState !== "none";
const NO_THAI_VOICE = "เครื่องนี้ไม่มีเสียงอ่านภาษาไทย บอทจึงตอบเป็นข้อความอย่างเดียว (ไม่ใช้เสียงภาษาอังกฤษอ่านแทน) " +
  "วิธีเพิ่มเสียงไทย: Windows: Settings > Time & language > Language & region > เพิ่มภาษาไทย แล้วเลือก Text-to-speech · " +
  "Android: ติดตั้ง Speech Services by Google แล้วเพิ่มภาษาไทย · iPhone/Mac: มีเสียงไทยอยู่แล้ว เลือกได้ในการตั้งค่า > การช่วยการเข้าถึง > เนื้อหาที่อ่านออกเสียง";

function warnNoThaiVoice() {
  if (warnedNoVoice) return;
  warnedNoVoice = true;
  note(NO_THAI_VOICE);
}

function thaiUtterance(text) {
  const u = new SpeechSynthesisUtterance(text.replace(/\s*\n\s*/g, " "));
  u.lang = "th-TH";
  if (thaiVoice) u.voice = thaiVoice;
  return u;
}

if (canSpeak) {
  pickThaiVoice();
  onVoicesChanged(pickThaiVoice);
} else speakBtn.hidden = true;

function setSpeak(on) {
  speakOn = on && canSpeak;
  speakBtn.textContent = speakOn ? "🔊" : "🔈";
  speakBtn.setAttribute("aria-pressed", speakOn);
  speakBtn.title = speakOn ? "ปิดเสียงตอบกลับ" : "เปิดเสียงตอบกลับ";
  if (!speakOn && canSpeak) speechSynthesis.cancel();
  if (speakOn && voiceState === "none") warnNoThaiVoice();
}
speakBtn.onclick = () => setSpeak(!speakOn);

function speak(reply) {
  if (!speakOn) return;
  speechSynthesis.cancel();
  if (!canSayThai()) {   // no Thai voice: text only, then carry on listening in hands-free mode
    warnNoThaiVoice();
    if (voiceTurn && handsFree && !reply.end && !reply.handoff && Recognition) setTimeout(listen, 600);
    return;
  }
  const u = thaiUtterance(reply.speech || reply.text);
  // Hands-free: after the bot finishes speaking, listen again, like a phone call.
  u.onend = () => { if (voiceTurn && handsFree && !reply.end && !reply.handoff && Recognition) listen(); };
  speechSynthesis.speak(u);
}

function setListening(on) {
  listening = on;
  micBtn.classList.toggle("on", on);
  micBtn.setAttribute("aria-pressed", on);
  micBtn.title = on ? "หยุดฟัง" : "แตะเพื่อพูด หรือกดค้างไว้แล้วปล่อยเพื่อส่ง";
  input.placeholder = !on ? "พิมพ์ข้อความ หรือกดไมค์เพื่อพูด"
    : holding ? "กำลังฟัง… ปล่อยปุ่มเพื่อส่ง" : "กำลังฟัง… พูดได้เลย";
}

function listen() {
  if (listening) return;
  if (canSpeak) speechSynthesis.cancel();  // the customer can interrupt the bot
  if (!speakOn) setSpeak(true);            // talking to the bot: it talks back
  recognizer = new Recognition();
  recognizer.lang = "th-TH";
  recognizer.interimResults = true;
  recognizer.continuous = false;  // a held button restarts it at pauses (see onend)
  let heard = "";
  recognizer.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) heard += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    input.value = heard + interim;
  };
  let failed = false, heardSound = false;
  recognizer.onaudiostart = () => { input.placeholder = holding ? "ไมค์รับเสียงแล้ว… ปล่อยปุ่มเพื่อส่ง" : "ไมค์รับเสียงแล้ว… พูดได้เลย"; };
  recognizer.onspeechstart = () => { heardSound = true; };
  recognizer.onerror = e => {
    if (e.error === "aborted") return;
    if (e.error === "no-speech") {
      if (!pressed) note("ไม่ได้ยินเสียงพูด ลองพูดใกล้ไมค์อีกครั้งได้เลย");
      return;
    }
    failed = true;  // stop for real: no restart while the button is held
    note((MIC_ERRORS[e.error] || "ฟังเสียงไม่สำเร็จ ลองใหม่อีกครั้ง หรือพิมพ์แทนได้") + ` (${e.error})`);
  };
  recognizer.onend = () => {
    if (pressed && !failed) {  // the browser stopped at a pause, but the button is still down: keep going
      try { recognizer.start(); return; } catch { /* fall through and send */ }
    }
    setListening(false);
    if (heard.trim()) send(heard, true);
    else {
      input.value = "";
      // Sound but no words, e.g. too quiet or too short: say so instead of doing nothing.
      if (!failed && heardSound) note("ได้ยินเสียงแต่จับคำพูดไม่ได้ ลองพูดช้า ๆ ใกล้ไมค์อีกครั้ง");
    }
  };
  setListening(true);
  try {
    recognizer.start();
  } catch (err) {
    setListening(false);
    note("เริ่มฟังเสียงไม่สำเร็จ ลองใหม่อีกครั้ง หรือพิมพ์แทนได้");
  }
}

function micDown(e) {
  e.preventDefault();
  if (listening) {             // tap while listening: stop and send what was heard
    recognizer.stop();
    return;
  }
  if (IN_APP && !warnedInApp) {
    warnedInApp = true;
    note("แอปนี้ (เช่น LINE, Facebook) อาจใช้ไมค์ไม่ได้ ถ้าพูดแล้วไม่มีข้อความ ให้กด ⋮ หรือ ··· แล้วเลือก เปิดในเบราว์เซอร์");
  }
  micBtn.setPointerCapture?.(e.pointerId);  // release counts even if the finger slides off
  pressed = true;
  holding = false;
  handsFree = true;
  listen();                    // start at once, so the first words are not lost
  holdTimer = setTimeout(() => {
    holding = true;            // still down: this is push-to-talk
    handsFree = false;
    setListening(listening);   // update the hint: "ปล่อยปุ่มเพื่อส่ง"
  }, HOLD_MS);
}

function micUp() {
  if (!pressed) return;
  pressed = false;             // first, so onend sends instead of restarting
  clearTimeout(holdTimer);
  if (holding && listening) recognizer.stop();  // released after a hold: send now
  holding = false;             // a short tap keeps listening, hands-free
}

if (Recognition) {
  micBtn.addEventListener("pointerdown", micDown);
  micBtn.addEventListener("pointerup", micUp);
  micBtn.addEventListener("pointercancel", micUp);
  micBtn.addEventListener("contextmenu", e => e.preventDefault());
}
else micBtn.hidden = true;  // e.g. Firefox: typing still works
// ---- Call mode: a phone-call screen. Talk back and forth with no buttons, like a phone line. ---
// The loop: the bot speaks -> listens -> the customer's words go to the bot -> repeat.
// Numbers can also be typed on the keypad. Silence gets "ยังอยู่ในสายไหม", then the call ends.
const $ = id => document.getElementById(id);
const callBtn = $("callBtn"), callScreen = $("callScreen"), callStatusEl = $("callStatus");
const callCaption = $("callCaption"), callInterim = $("callInterim"), callErrorEl = $("callError");
const callChips = $("callChips"), keypad = $("keypad"), digitsEl = $("digits"), callTimer = $("callTimer");
const muteBtn = $("muteBtn"), keypadBtn = $("keypadBtn");
let inCall = false, muted = false, injected = null, wakeHear = null, callRec = null;
let callStarted = 0, timerId = null, wakeLock = null, digits = "";

const sleep = ms => new Promise(r => setTimeout(r, ms));

function callStatus(text, state = "") { callStatusEl.textContent = text; callScreen.dataset.state = state; }

// Speak a line and wait until done. The caption shows exactly the line being spoken:
// line.text as written, line.speech as read aloud (same words, numbers digit by digit).
function say(line) {
  return new Promise(resolve => {
    if (!inCall) return resolve();
    speechSynthesis.cancel();
    callCaption.textContent = line.text;
    const text = line.speech || line.text;
    if (!canSayThai()) {   // no Thai voice: show the line and give time to read it
      callStatus("อ่านคำตอบบนจอ (เครื่องนี้ไม่มีเสียงไทย)", "speaking");
      setTimeout(resolve, Math.min(8000, 1500 + line.text.length * 60));
      return;
    }
    const u = thaiUtterance(text);
    let timer;
    const done = () => { clearTimeout(timer); resolve(); };
    u.onend = done; u.onerror = done;
    timer = setTimeout(done, 4000 + text.length * 120);  // some browsers never fire onend
    callStatus("ผู้ช่วยกำลังพูด…", "speaking");
    speechSynthesis.speak(u);
  });
}

// Listen for one utterance. Resolves with the words, "" for silence, or null when something else
// (keypad, a button, mute) interrupted: then the loop just goes round again.
function hear() {
  return new Promise(resolve => {
    let heard = "", settled = false, timer = null;
    const finish = v => {
      if (settled) return;
      settled = true; clearTimeout(timer); wakeHear = null; callRec = null; callInterim.textContent = "";
      resolve(v);
    };
    wakeHear = finish;
    if (muted) { callStatus("ปิดไมค์อยู่ · กดแป้นตัวเลขหรือปุ่มด้านบนได้", "muted"); return; }
    const rec = callRec = new Recognition();
    rec.lang = "th-TH"; rec.interimResults = true; rec.continuous = false;
    rec.onaudiostart = () => callStatus("กำลังฟัง… พูดได้เลย", "listening");
    rec.onspeechstart = () => { clearTimeout(timer); timer = setTimeout(() => rec.stop(), 20000); };
    rec.onresult = e => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) heard += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      callInterim.textContent = heard + interim;
    };
    rec.onerror = e => { if (e.error !== "no-speech" && e.error !== "aborted") callError(e.error); };
    rec.onend = () => finish(heard.trim());
    timer = setTimeout(() => rec.abort(), 10000);  // nobody spoke: count it as silence
    callStatus("กำลังฟัง… พูดได้เลย", "listening");
    try { rec.start(); } catch { finish(""); }
  });
}

function stopListening() {       // end the current listen; the loop goes round again
  const rec = callRec;           // keep it: wakeHear() clears callRec
  if (wakeHear) wakeHear(null);
  if (rec) rec.abort();
}

function interrupt() {           // stop speaking and listening now
  speechSynthesis.cancel();
  stopListening();
}

function inject(text) { injected = text; interrupt(); }  // keypad or a button answered instead

function callError(code) {
  callErrorEl.textContent = (MIC_ERRORS[code] || "ฟังเสียงไม่สำเร็จ") + ` (${code}) · ใช้แป้นตัวเลขหรือปุ่มแทนได้`;
  note((MIC_ERRORS[code] || "ฟังเสียงไม่สำเร็จ") + ` (${code})`);
  setMuted(true);
  showKeypad(true);
}

function setMuted(on) {
  muted = on;
  muteBtn.setAttribute("aria-pressed", on);
  muteBtn.textContent = on ? "🔇" : "🎙️";
  if (on) stopListening();                    // the mic goes off now
  else if (wakeHear) wakeHear(null);          // start listening again
}

function showKeypad(on) {
  keypad.hidden = !on;
  keypadBtn.setAttribute("aria-pressed", on);
}

function showCallReply(reply) {
  callCaption.textContent = reply.text;
  callChips.innerHTML = "";
  for (const label of reply.quick_replies || []) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label;
    b.onclick = () => inject(label);
    callChips.appendChild(b);
  }
  if (reply.expects === "digits") showKeypad(true);
}

async function runCall() {
  let reply = await call("api/start", {});
  // The bot's own wording tells us its voice: ครับ or ค่ะ/คะ.
  const [p, q] = reply.text.includes("ครับ") ? ["ครับ", "ครับ"] : ["ค่ะ", "คะ"];
  const menu = (reply.quick_replies || []).filter(x => !x.includes("เจ้าหน้าที่")).join(" ");
  const invite = ` พูดได้เลย${p} เช่น ${menu} หรือคุยกับเจ้าหน้าที่`;
  let speech = { text: reply.text + invite, speech: reply.speech + invite };
  let silence = 0;
  add(speech.text, "bot");
  const line = text => { add(text, "bot"); return { text }; };  // a line the call itself adds
  while (inCall) {
    showCallReply(reply);
    if (speech) await say(speech);
    speech = null;
    if (!inCall) return;
    if (reply.end) { await sleep(400); return hangUp(); }
    if (reply.handoff) {
      callStatus("กำลังโอนสายให้เจ้าหน้าที่…", "transfer");
      await sleep(3500);
      if (inCall) { note("ตัวอย่าง: ยังไม่ได้เชื่อมต่อระบบเจ้าหน้าที่จริง"); hangUp(); }
      return;
    }
    let msg = injected ? null : await hear();
    if (!inCall) return;
    if (injected) { msg = injected; injected = null; }
    if (msg === null) continue;
    if (!msg) {                                  // silence
      if (muted || !keypad.hidden) continue;     // typing on the keypad is not silence
      silence++;
      if (silence === 2) speech = line(`ยังอยู่ในสายไหม${q} ถ้าต้องการให้ช่วยเรื่องใด พูดได้เลย${p}`);
      if (silence >= 3) {
        await say(line(`ไม่ได้ยินเสียง ขออนุญาตวางสายก่อน${p} ขอบคุณที่ติดต่อ${p}`));
        return hangUp();
      }
      continue;
    }
    silence = 0;
    callErrorEl.textContent = "";
    add(msg, "me");
    callInterim.textContent = msg;
    callStatus("กำลังดำเนินการ…", "thinking");
    try {
      reply = await call("api/chat", { message: msg });
    } catch {
      speech = line(`ขออภัย ระบบขัดข้องชั่วคราว รบกวนพูดอีกครั้ง${p}`);
      continue;
    }
    if (!reply.expects) showKeypad(false);
    add(reply.text, "bot");
    speech = reply;
  }
}

async function startCall() {
  if (inCall) return;
  if (listening && recognizer) recognizer.abort();       // stop the chat mic if it was on
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(""));  // iPhone: unlock speech inside the tap
  inCall = true; injected = null; digits = ""; digitsEl.textContent = "";
  setMuted(false); showKeypad(false);
  callCaption.textContent = ""; callErrorEl.textContent = ""; callChips.innerHTML = "";
  callStatus("กำลังเชื่อมต่อ…", "connecting");
  callScreen.hidden = false;
  callStarted = Date.now();
  const tick = () => {
    const sec = Math.floor((Date.now() - callStarted) / 1000);
    callTimer.textContent = `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`;
  };
  tick(); timerId = setInterval(tick, 1000);
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch { wakeLock = null; }  // keep screen on
  sessionId = crypto.randomUUID();          // a call is a new conversation
  sessionStorage.setItem("chat_session", sessionId);
  quick.innerHTML = "";
  note("📞 เริ่มการโทร");
  await voicesReady(); pickThaiVoice();
  if (voiceState === "none") { callErrorEl.textContent = NO_THAI_VOICE; warnNoThaiVoice(); }
  else if (IN_APP) callErrorEl.textContent = "แอปนี้อาจใช้ไมค์ไม่ได้ ถ้าพูดแล้วไม่มีข้อความ ให้เปิดในเบราว์เซอร์";
  try { await runCall(); }
  catch { note("การโทรขัดข้อง กรุณาลองใหม่"); hangUp(); }
}

function hangUp() {
  if (!inCall) return;
  inCall = false;
  interrupt();
  clearInterval(timerId);
  wakeLock?.release().catch(() => {}); wakeLock = null;
  callScreen.hidden = true;
  note(`วางสายแล้ว · ${callTimer.textContent}`);
  input.focus();
}

// Keypad: digits, ⌫, and ส่ง (like # on a phone).
for (const k of ["1", "2", "3", "4", "5", "6", "7", "8", "9", "⌫", "0", "ส่ง"]) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = k;
  if (k === "ส่ง") b.className = "ok";
  b.onclick = () => {
    if (k === "⌫") digits = digits.slice(0, -1);
    else if (k === "ส่ง") { if (digits) { inject(digits); digits = ""; } }
    else { digits += k; speechSynthesis.cancel(); }  // typing interrupts the bot, like a phone menu
    digitsEl.textContent = digits;
  };
  keypad.appendChild(b);
}
keypadBtn.onclick = () => showKeypad(keypad.hidden);
muteBtn.onclick = () => setMuted(!muted);
$("hangup").onclick = hangUp;
callBtn.onclick = startCall;
callBtn.hidden = !(Recognition && canSpeak);   // a call needs both listening and speaking

async function init() {
  input.disabled = true;
  note("กำลังโหลดผู้ช่วย… (ครั้งแรกอาจใช้เวลาสักครู่)");
  runtime = await startRuntime();
  await voicesReady(); if (canSpeak) pickThaiVoice();
  log.lastChild.remove();  // the loading note
  if (runtime.mode === "browser") {
    note("โหมดสาธิต: ระบบทำงานในเบราว์เซอร์ ข้อมูลเก็บไว้ในเบราว์เซอร์นี้เท่านั้น (ดู/แก้ได้ที่ 📋 ข้อมูล)");
    addEventListener("storage", () => runtime.reload());  // rows edited in the admin tab
  }
  show(await call("api/start", {}));
  input.disabled = false;
  callBtn.disabled = false;
  input.focus();
}
init().catch(() => note("เชื่อมต่อระบบไม่สำเร็จ กรุณารีเฟรชหน้าอีกครั้ง"));
</script>
</body>
</html>
